name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Omne.Screen.sln

      - name: Build
        run: dotnet build Omne.Screen.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test Omne.Screen.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: error

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Build UI
        working-directory: src/ui
        run: |
          npm ci
          npm run build

  images-and-scan:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Image tag (branch + short SHA)
        id: meta
        shell: bash
        run: |
          echo "branch=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Api/Dockerfile
          load: true
          tags: omne-api:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build BFF image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Bff/Dockerfile
          load: true
          tags: omne-bff:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ui/Dockerfile
          load: true
          tags: omne-ui:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: SBOM (API)
        uses: anchore/sbom-action@v0
        with:
          image: omne-api:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }}
          format: spdx-json
          output-file: artifacts/sbom-api.spdx.json
          upload-artifact: false

      - name: SBOM (BFF)
        uses: anchore/sbom-action@v0
        with:
          image: omne-bff:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }}
          format: spdx-json
          output-file: artifacts/sbom-bff.spdx.json
          upload-artifact: false

      - name: SBOM (UI)
        uses: anchore/sbom-action@v0
        with:
          image: omne-ui:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }}
          format: spdx-json
          output-file: artifacts/sbom-ui.spdx.json
          upload-artifact: false

      - name: Scan API (HIGH/CRITICAL gates)
        id: scan_api
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: omne-api:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }}
          format: json
          output: artifacts/trivy-api.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan BFF (HIGH/CRITICAL gates)
        id: scan_bff
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: omne-bff:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }}
          format: json
          output: artifacts/trivy-bff.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan UI (HIGH/CRITICAL gates)
        id: scan_ui
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: omne-ui:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }}
          format: json
          output: artifacts/trivy-ui.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload SBOMs and scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: artifacts/**
          if-no-files-found: error

      - name: Fail if any HIGH/CRITICAL vulnerabilities were found
        if: steps.scan_api.outcome == 'failure' || steps.scan_bff.outcome == 'failure' || steps.scan_ui.outcome == 'failure'
        run: |
          echo "::error::Trivy found fixable HIGH/CRITICAL vulnerabilities. See the security-artifacts."
          exit 1
